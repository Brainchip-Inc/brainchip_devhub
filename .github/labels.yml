# Label scheme for brainchip_devhub GitHub issues and PRs.
# Source of truth for labels; sync to GitHub with a label-sync action or `gh label create --force`.
#
# Planned work is tracked internally, not in GitHub Issues (see CLAUDE.md, "Planning and
# work tracking"). GitHub issues come from outside users (bug reports) and the weekly
# broken-link check.
#
# Rules:
# - Every triaged issue has exactly one type:* and at least one content:* label.
# - platform:* is set whenever the issue is platform-specific.
# - needs-triage is applied by the issue template and the link check, and removed once
#   the above are set.

# --- What kind of work ---------------------------------------------------------
- name: "type:new-content"
  color: "0e8a16"
  description: "New example, tutorial, guide or page"
- name: "type:update"
  color: "1d76db"
  description: "Refresh or improve existing content (incl. SDK/toolchain bumps)"
- name: "type:bug"
  color: "d73a4a"
  description: "Something doesn't run, doesn't reproduce, or is wrong"
- name: "type:tooling"
  color: "5319e7"
  description: "CI, scripts, brainchip_utils, Claude config. Not reader-facing."

# --- Which content area --------------------------------------------------------
- name: "content:model-zoo"
  color: "fbca04"
  description: "akida*/model_zoo examples"
- name: "content:tutorial"
  color: "fbca04"
  description: "Tutorial notebooks / concept walkthroughs"
- name: "content:deployment"
  color: "fbca04"
  description: "Deployment and on-device benchmarking guides"
- name: "content:landing"
  color: "fbca04"
  description: "README landing pages, navigation, zoo tables"

# --- Which platform ------------------------------------------------------------
- name: "platform:akida1"
  color: "f9d0c4"
  description: "AKD1000 / AKD1500"
- name: "platform:akida2"
  color: "f9d0c4"
  description: "AKD2500 / v2 FPGA"
- name: "platform:pico"
  color: "f9d0c4"
  description: "Akida Pico"

# --- Triage --------------------------------------------------------------------
- name: "needs-triage"
  color: "ededed"
  description: "New; labels, acceptance criteria or source material not yet confirmed"

# --- Community (GitHub surfaces these to outside contributors) ------------------
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

# Default labels to retire (map existing usages first):
#   bug -> type:bug, enhancement -> type:new-content, documentation -> type:update,
#   question -> needs-triage. duplicate, invalid, wontfix -> use "Close as not planned / duplicate".
