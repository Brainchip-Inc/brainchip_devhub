name: content-checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC: external link check

permissions:
  contents: read

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generated-README drift, local links, version badges, LFS pointers and
  # machine-specific paths. Only findings on lines the PR changes fail the job;
  # older findings are listed for information.
  content:
    name: content checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check content
        run: python .claude/skills/review-content/check_content.py --base "origin/${{ github.base_ref || 'main' }}"

  # Unit tests that need neither hardware nor model files. test_models.py is
  # run by the models-float / models-hardware workflows, scoped to changed models.
  unit-tests:
    name: unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned toolchain (CPU, public PyPI)
        run: |
          # Same pins as pyproject.toml, with the CPU tensorflow build (see ci.yml).
          AKIDA_MODELS_SPEC=$(grep -oE 'akida_models==[0-9][0-9a-z.]*' pyproject.toml | head -1)
          TF_SPEC=$(grep -oE 'tensorflow(\[and-cuda\])?==[0-9][0-9a-z.]*' pyproject.toml | head -1 | sed 's/\[and-cuda\]//')
          pip install "$TF_SPEC" "$AKIDA_MODELS_SPEC" pytest

      - name: Unit tests
        run: python -m pytest test -v -m "not hardware" --ignore=test/test_models.py

  # Weekly, not per PR, so a flaky external site never blocks a merge. Broken
  # links are reported in a single tracking issue, updated on each failing run.
  external-links:
    name: external links
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: lychee/out.md
          # silabs.com answers automated requests with 403, though the VWW
          # dataset download works from colab_setup.py and browsers.
          args: >-
            --no-progress
            --scheme https --scheme http
            --max-retries 3 --retry-wait-time 5
            --accept '200..=299,429'
            --exclude 'silabs\.com'
            --exclude-path '.claude'
            './**/*.md'

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Broken external links (weekly check)"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file lychee/out.md
          else
            gh issue create --title "$TITLE" --body-file lychee/out.md \
              --label "type:bug" --label "content:landing" --label "needs-triage"
          fi
