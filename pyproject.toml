[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brainchip_utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tensorflow==2.19.1",
    "tensorflow-metadata<1.21",
    "akida_models==1.14.0",
    "pyftdi",
    "ipykernel",
    "pyyaml",
    "pywavelets",
    "wfdb"
]

[project.optional-dependencies]
# GPU training for the Keras/TensorFlow examples. Evaluation, conversion and
# benchmarking don't need it.
# Never combine with [torch] in one environment: TensorFlow's CUDA 12 wheels and
# PyTorch's CUDA 13 wheels install into the same paths, and torch then fails to
# import (tested 2026-10-08, issue #71).
cuda = ["tensorflow[and-cuda]==2.19.1"]
# PyTorch-based examples. Use a separate environment from [cuda]: PyTorch trains
# on the GPU, and TensorFlow runs on the CPU, which is all the Akida steps need.
torch = [
    "torch==2.14.1",
    "timm",
    "onnx",
    "onnxruntime",
    "torchmetrics",
    "albumentations",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainchip_utils*"]

[tool.pytest.ini_options]
markers = [
    "hardware: test requires an Akida hardware device",
    "flaky: rerun on failure (provided by pytest-rerunfailures in the hardware CI)",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
