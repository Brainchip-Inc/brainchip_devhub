[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brainchip_utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tensorflow[and-cuda]==2.19.1",
    "tensorflow-metadata<1.21",
    "akida_models==1.14.0",
    "pyftdi",
    "ipykernel",
    "opencv-python==5.0.0.93",
    "pywavelets",
    "wfdb",
    "numpy",
    "scipy",
    "joblib",
    "cnn2snn==2.19.1",
    "akida==2.19.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainchip_utils*"]
