[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brainchip_utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tensorflow==2.19.1",
    "tensorflow-metadata<1.21",
    "akida_models==1.14.0",
    "pyftdi",
    "ipykernel",
    "pyyaml",
    "pywavelets",
    "wfdb"
]

[project.optional-dependencies]
# GPU training for the Keras/TensorFlow examples. Evaluation, conversion and
# benchmarking don't need it. Can't be combined with [torch]: the two pin
# different versions of the same nvidia-*-cu12 wheels, and pip refuses.
cuda = ["tensorflow[and-cuda]==2.19.1"]
# PyTorch examples (Akida 2 only): models are exported to ONNX and converted with
# onnx2akida, which supports 8-bit post-training quantization but not QAT.
# torch is pinned to 2.10.0, the newest release whose default ONNX exporter works
# with onnx2akida 0.7.0 (which pins onnx_ir==0.1.9); from 2.11 the exporter needs a
# newer onnx_ir. onnxscript is required by that exporter. Revisit the torch pin
# when onnx2akida relaxes its onnx_ir pin (tested 2026-10-09, issue #71).
torch = [
    "onnx2akida==0.7.0",
    "torch==2.10.0",
    "onnxscript",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainchip_utils*"]

[tool.pytest.ini_options]
markers = [
    "hardware: test requires an Akida hardware device",
    "flaky: rerun on failure (provided by pytest-rerunfailures in the hardware CI)",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
