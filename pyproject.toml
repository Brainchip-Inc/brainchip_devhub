[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "brainchip_utils"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tensorflow[and-cuda]==2.19.1",
    "tensorflow-metadata<1.21",
    "akida_models==1.14.0",
    "pyftdi",
    "ipykernel",
    "pyyaml",
    "pywavelets",
    "wfdb"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["brainchip_utils*"]

[tool.pytest.ini_options]
markers = [
    "hardware: test requires an Akida hardware device",
    "flaky: rerun on failure (provided by pytest-rerunfailures in the hardware CI)",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
